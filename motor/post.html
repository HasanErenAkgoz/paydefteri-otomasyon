<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>PayDefteri post slide</title>
<link rel="stylesheet" href="style.css">
<style>
  .glow.a { width: 700px; height: 700px; background: rgba(124,58,237,.40); }
  .glow.b { width: 600px; height: 520px; background: rgba(99,102,241,.24); }
  .t0 .glow.a { right: -220px; top: 420px; } .t0 .glow.b { left: -260px; top: -200px; }
  .t1 .glow.a { left: -260px; top: 520px; }  .t1 .glow.b { right: -220px; top: -160px; }
  .t2 .glow.a { left: 190px; top: 700px; }   .t2 .glow.b { left: 240px; top: -260px; }

  .head { position: absolute; top: 164px; left: 72px; right: 72px; z-index: 5; }
  .head h1 { font-size: 92px; margin-top: 26px; }
  .head .sub { margin-top: 22px; font-size: 29px; max-width: 900px; }
  .head.center { text-align: center; }
  .head.center .sub { margin-left: auto; margin-right: auto; }

  .halo { position: absolute; width: 560px; height: 560px; transform: translate(-50%, -50%); border-radius: 50%;
    border: 2px solid rgba(192,132,252,.6); box-shadow: 0 0 26px rgba(168,85,247,.7), 0 0 80px rgba(124,58,237,.4), inset 0 0 36px rgba(168,85,247,.3); }
  .phone.main { z-index: 3; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.2), inset 0 0 0 4px #07080b,
      0 60px 100px -20px rgba(0,0,0,.85), 0 0 110px rgba(124,58,237,.5); }
  .crop { z-index: 4; border-radius: 22px; box-shadow: 0 30px 60px -10px rgba(0,0,0,.7), 0 0 0 1px rgba(167,139,250,.28); }

  .stage { position: absolute; left: 72px; right: 72px; top: 590px; bottom: 215px; z-index: 4;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
  .stage .crop { position: relative; box-shadow: 0 40px 80px -10px rgba(0,0,0,.75), 0 0 0 1px rgba(167,139,250,.3), 0 0 90px rgba(124,58,237,.35); }
  .note { font-size: 26px; line-height: 1.45; color: var(--muted); text-align: center; max-width: 860px; }
  .note strong { color: var(--text); font-weight: 600; }

  .items { position: absolute; left: 72px; right: 72px; top: 600px; bottom: 215px; z-index: 4;
    display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .item { display: flex; align-items: center; gap: 26px; padding: 22px 26px; border-radius: 26px;
    background: rgba(15,20,36,.72); border: 1px solid var(--line); }
  .item .n { flex: none; width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center;
    font: 800 32px Outfit, sans-serif; color: #fff; background: linear-gradient(145deg, var(--violet), var(--indigo));
    box-shadow: 0 10px 30px rgba(124,58,237,.35); }
  .item .tx { flex: 1; }
  .item h3 { font: 700 31px/1.15 Outfit, sans-serif; }
  .item p { margin-top: 8px; font-size: 22px; line-height: 1.4; color: var(--muted); }
  .item .crop { position: relative; flex: none; border-radius: 14px; box-shadow: 0 0 0 1px rgba(167,139,250,.28); }

  .hint { position: absolute; right: 72px; bottom: 70px; z-index: 6; padding: 16px 28px; border-radius: 999px;
    font: 600 24px Inter, sans-serif; color: var(--lilac); background: rgba(14,18,33,.85); border: 1px solid var(--line); }

  .end { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .end img.logo { width: 180px; height: 180px; border-radius: 46px; box-shadow: 0 0 0 1px rgba(167,139,250,.4), 0 0 120px rgba(124,58,237,.7); }
  .end h1 { margin-top: 50px; font-size: 110px; }
  .end .sub { margin-top: 24px; max-width: 820px; }
  .end .badge { margin-top: 60px; height: 120px; }
  .end .url { margin-top: 34px; font-size: 24px; color: var(--muted); letter-spacing: .04em; }

  .cta {
    position: absolute; left: 72px; right: 72px; bottom: 60px; height: 132px; z-index: 6;
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 40px;
    border-radius: 30px; background: rgba(14,18,33,.86); border: 1px solid var(--line);
    backdrop-filter: blur(18px); box-shadow: 0 -20px 60px rgba(9,13,22,.6), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .cta b { display: block; font-family: Outfit, sans-serif; font-size: 32px; font-weight: 700; }
  .cta span { display: block; margin-top: 6px; font-size: 20px; color: var(--muted); }
  .cta .badge { height: 92px; }
</style>
</head>
<body>
<div class="post" id="post"></div>
<script src="kirpimlar.js"></script>
<script>
// build(slide, {index, total}) renders one 1080x1350 slide. Layouts: telefon, kart, liste, kapak, son.
window.build = async (s, { index = 0, total = 1 } = {}) => {
  await preload();
  const post = document.getElementById('post');
  post.className = 'post t' + (s.tema ?? index % 3);
  const pager = total > 1 ? `${index + 1} / ${total}` : 'paydefteri.com';
  post.innerHTML = `<div class="glow a"></div><div class="glow b"></div><div class="grid"></div>
    <header class="brand"><div class="id"><img src="assets/logo.png" alt=""><b>Pay<span>Defteri</span></b></div><div class="url">${pager}</div></header>`;
  const add = (html) => { const d = document.createElement('div'); d.innerHTML = html; post.append(...d.childNodes); };
  const head = (center) => `<section class="head${center ? ' center' : ''}">${s.eyebrow ? `<div class="eyebrow"><i></i>${markup(s.eyebrow)}</div>` : ''}
    <h1>${markup(s.title)}</h1>${s.sub ? `<p class="sub">${markup(s.sub)}</p>` : ''}</section>`;
  let cta = !!s.cta;
  const headBottom = () => post.querySelector('.head').getBoundingClientRect().bottom;

  if (s.layout === 'telefon') {
    add(head() + `<div class="halo" style="left:820px;top:880px"></div>`);
    const p = phoneEl(s.screen, 360, 'main'); p.style.cssText += ';left:640px;top:580px;transform:rotate(4deg)'; post.append(p);
    const crops = s.crops || [];
    const slots = crops.length > 1 ? [[640, 240], [915, 215]] : [[700, 400]];
    crops.slice(0, 2).forEach((name, i) => {
      const c = cropEl(name, 560, slots[i][1]);
      c.style.left = '56px'; c.style.top = slots[i][0] + 'px'; c.style.transform = `rotate(${i ? 3 : -3}deg)`;
      post.append(c);
    });
  } else if (s.layout === 'kart') {
    add(head(true));
    // stage fills the space between the headline and the CTA bar
    const top = headBottom() + 50, bottom = cta ? 1135 : 1290;
    const st = document.createElement('div'); st.className = 'stage';
    st.style.top = top + 'px'; st.style.bottom = (1350 - bottom) + 'px';
    st.append(cropEl(s.crop, 936, bottom - top - (s.note ? 120 : 20)));
    if (s.note) { const n = document.createElement('p'); n.className = 'note'; n.innerHTML = markup(s.note); st.append(n); }
    post.append(st);
  } else if (s.layout === 'liste') {
    add(head());
    const box = document.createElement('div'); box.className = 'items';
    box.style.top = (headBottom() + 40) + 'px'; box.style.bottom = (cta ? 215 : 80) + 'px';
    (s.items || []).slice(0, 3).forEach((it, i) => {
      const row = document.createElement('div'); row.className = 'item';
      row.innerHTML = `<div class="n">${i + 1}</div><div class="tx"><h3>${markup(it.t)}</h3>${it.d ? `<p>${markup(it.d)}</p>` : ''}</div>`;
      if (it.crop) row.append(cropEl(it.crop, 300, 130));
      box.append(row);
    });
    post.append(box);
  } else if (s.layout === 'kapak') {
    add(head(true) + `<div class="halo" style="left:540px;top:1180px;width:640px;height:640px"></div>`);
    post.querySelector('.head').style.top = '230px';
    post.querySelector('.head h1').style.fontSize = '112px';
    const p = phoneEl(s.screen || 'takip', 440, 'main'); p.style.cssText += ';left:320px;top:800px'; post.append(p);
    add(`<div class="hint">${markup(s.hint || 'Kaydır →')}</div>`);
    cta = false;
  } else if (s.layout === 'son') {
    add(`<div class="halo" style="left:540px;top:520px;width:420px;height:420px"></div><div class="end">
      <img class="logo" src="assets/logo.png" alt=""><h1>${markup(s.title || 'Pay*Defteri*')}</h1>
      <p class="sub">${markup(s.sub || 'Ortak plan, tek defter.')}</p>
      ${s.play ? '<img class="badge" src="assets/google-play-badge-tr.png" alt="Google Play’den indirin">' : ''}<div class="url">paydefteri.com</div></div>`);
    post.querySelector('.brand').remove();
    cta = false;
  } else {
    throw new Error('unknown layout: ' + s.layout);
  }

  if (cta) add(`<footer class="cta"><div><b>${markup(s.ctaTitle || 'Ücretsiz indir')}</b><span>Android’de ücretsiz · bağlantı profilde</span></div>
    <img class="badge" src="assets/google-play-badge-tr.png" alt="Google Play’den indirin"></footer>`);
  add('<div class="noise"></div>');
  await Promise.all([...post.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
};
</script>
</body>
</html>
